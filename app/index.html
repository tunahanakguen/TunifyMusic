<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/tunify-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tunify Music</title>
    <script>
      // Design vor dem ersten Zeichnen setzen (gleiche Logik wie src/theme.ts)
      (function () {
        var c = "light";
        try { c = localStorage.getItem("tunify.theme") || c; } catch (e) {}
        var dark = c === "dark" || (c === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
